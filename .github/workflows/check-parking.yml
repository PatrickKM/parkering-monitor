name: Check Randers parking

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/check_parking.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PARKING_THRESHOLD: "20"

      - name: Commit status
        run: |
          git config user.name "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet || git commit -m "Update parking status"
          git push
