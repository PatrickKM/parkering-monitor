<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P Gasværksgrunden</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column;
         align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
  #count { font-size: 22vw; font-weight:700; line-height:1; }
  #max { font-size:5vw; opacity:0.6; }
  #updated { font-size:3vw; opacity:0.5; margin-top:1em; }
  .low { color:#ff5555; }
  #refresh { margin-top:1.5em; font-size:4vw; padding:0.6em 1.4em; border-radius:2em; border:1px solid #444;
             background:#1c1c1c; color:#eee; }
  #refresh:active { background:#2a2a2a; }
  #refresh:disabled { opacity:0.5; }
  #push { margin-top:0.8em; font-size:3vw; padding:0.5em 1.2em; border-radius:2em; border:1px solid #333;
          background:transparent; color:#9c9; }
  #push:disabled { opacity:0.5; }
</style>
</head>
<body>
  <div id="count">…</div>
  <div id="max"></div>
  <div id="updated"></div>
  <button id="refresh">Opdater nu</button>
  <button id="push">Aktiver notifikation</button>
<script>
const WORKER_URL = 'https://parking-proxy.patrickkoomadsen.workers.dev';
const THRESHOLD = 20;
// Public VAPID key — not secret, must match worker/worker.js's VAPID_PUBLIC_KEY.
const VAPID_PUBLIC_KEY = 'BMXdPepcic_OEKsEY-agIMF1lvxUQWCgOai38w8E2f5D5YVNz5mcwE4N0X6GuFLEqHGFYQbNsmW1heVkmZMcr4w';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function render(available, max, checkedAt, label) {
  const el = document.getElementById('count');
  el.textContent = available;
  el.className = available <= THRESHOLD ? 'low' : '';
  document.getElementById('max').textContent = 'af ' + max + ' pladser';
  document.getElementById('updated').textContent = label + ' ' + checkedAt.toLocaleTimeString('da-DK');
}

async function loadLive() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  const r = await fetch(WORKER_URL, { signal: controller.signal, cache: 'no-store' });
  clearTimeout(timeout);
  if (!r.ok) throw new Error('worker http ' + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  render(d.available, d.max, new Date(d.checked_at), 'live nu');
}

async function loadCached() {
  const r = await fetch('status.json?_=' + Date.now());
  const d = await r.json();
  render(d.available, d.max, new Date(d.checked_at), 'cache,');
}

async function load() {
  try {
    await loadLive();
  } catch (e) {
    try {
      await loadCached();
    } catch (e2) {
      document.getElementById('count').textContent = '?';
    }
  }
}
const refreshBtn = document.getElementById('refresh');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  await load();
  refreshBtn.disabled = false;
});

load();
setInterval(load, 60000);

let swRegistration = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => { swRegistration = reg; });
}

const pushBtn = document.getElementById('push');

async function checkExistingSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    pushBtn.disabled = true;
    pushBtn.textContent = 'Notifikation ikke understøttet';
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) {
    pushBtn.textContent = 'Notifikation aktiveret';
    pushBtn.disabled = true;
  }
}

pushBtn.addEventListener('click', async () => {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    await fetch(WORKER_URL + '/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });
    pushBtn.textContent = 'Notifikation aktiveret';
    pushBtn.disabled = true;
  } catch (e) {
    pushBtn.textContent = 'Kunne ikke aktivere';
  }
});

checkExistingSubscription();
</script>
</body>
</html>
