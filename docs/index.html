<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P Gasværksgrunden</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0;
    min-height:100vh; display:flex; justify-content:center; padding:2rem 1rem;
  }
  .card {
    width:100%; max-width:420px; text-align:center; align-self:flex-start;
    margin-top:min(8vh, 3rem);
  }
  h1 { font-size:1rem; font-weight:500; opacity:0.7; margin:0 0 1.2rem; }
  #count { font-size:clamp(3.5rem, 22vw, 7rem); font-weight:700; line-height:1; }
  #max { font-size:clamp(0.9rem, 5vw, 1.2rem); opacity:0.6; margin-top:0.3em; }
  #updated { font-size:clamp(0.75rem, 3vw, 0.9rem); opacity:0.5; margin-top:1em; }
  .low { color:#ff5555; }
  .buttons { display:flex; flex-direction:column; align-items:center; gap:0.6em; margin-top:1.5em; }
  button {
    font-family:inherit; font-size:clamp(0.85rem, 4vw, 1rem); padding:0.6em 1.4em;
    border-radius:2em; border:1px solid #444; background:#1c1c1c; color:#eee; cursor:pointer;
  }
  button:active { background:#2a2a2a; }
  button:disabled { opacity:0.5; cursor:default; }
  #push, #shownotif { border-color:#333; background:transparent; color:#9c9; font-size:clamp(0.75rem, 3vw, 0.9rem); }

  .history { margin-top:2.5em; text-align:left; }
  .history h2 { font-size:0.95rem; font-weight:500; opacity:0.7; margin:0 0 0.6em; }
  .day-toggle { display:flex; gap:0.4em; margin-bottom:0.8em; flex-wrap:wrap; }
  .day-btn {
    font-size:0.8rem; padding:0.4em 0.8em; border-radius:1em; border:1px solid #333;
    background:transparent; color:#999;
  }
  .day-btn.active { background:#2a2a2a; color:#eee; border-color:#555; }
  .history-empty { font-size:0.85rem; opacity:0.5; }
  table.history-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.history-table td { padding:0.4em 0.2em; border-bottom:1px solid #262626; }
  table.history-table td.time { opacity:0.6; width:4.5em; }
  table.history-table td.count { text-align:right; font-weight:600; }
  table.history-table tr.low td.count { color:#ff5555; }

  @media (min-width: 600px) {
    body { align-items:center; }
    .card {
      align-self:center; margin-top:0; background:#181818; border:1px solid #262626;
      border-radius:1.2rem; padding:2.5rem 2rem;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>P Gasværksgrunden, Jernbanegade</h1>
    <div id="count">…</div>
    <div id="max"></div>
    <div id="updated"></div>
    <div class="buttons">
      <button id="refresh">Opdater nu</button>
      <button id="push">Aktiver notifikation</button>
      <button id="shownotif">Vis notifikation</button>
    </div>
    <div class="history">
      <h2>Morgen-historik (07-09)</h2>
      <div class="day-toggle" id="day-toggle"></div>
      <div id="history-body"><div class="history-empty">Indlæser…</div></div>
    </div>
  </div>
<script>
const WORKER_URL = 'https://parking-proxy.patrickkoomadsen.workers.dev';
const THRESHOLD = 20;
// Public VAPID key — not secret, must match worker/worker.js's VAPID_PUBLIC_KEY.
const VAPID_PUBLIC_KEY = 'BMXdPepcic_OEKsEY-agIMF1lvxUQWCgOai38w8E2f5D5YVNz5mcwE4N0X6GuFLEqHGFYQbNsmW1heVkmZMcr4w';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

let lastState = null;

function render(available, max, checkedAt, label) {
  const el = document.getElementById('count');
  el.textContent = available;
  el.className = available <= THRESHOLD ? 'low' : '';
  document.getElementById('max').textContent = 'af ' + max + ' pladser';
  document.getElementById('updated').textContent = label + ' ' + checkedAt.toLocaleTimeString('da-DK');
  lastState = { available, max, checked_at: checkedAt.toISOString() };
}

async function loadLive() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  const r = await fetch(WORKER_URL, { signal: controller.signal, cache: 'no-store' });
  clearTimeout(timeout);
  if (!r.ok) throw new Error('worker http ' + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  render(d.available, d.max, new Date(d.checked_at), 'live nu');
}

async function loadCached() {
  const r = await fetch('status.json?_=' + Date.now());
  const d = await r.json();
  render(d.available, d.max, new Date(d.checked_at), 'cache,');
}

async function load() {
  try {
    await loadLive();
  } catch (e) {
    try {
      await loadCached();
    } catch (e2) {
      document.getElementById('count').textContent = '?';
    }
  }
}

const WEEKDAY_LABELS = ['Man', 'Tir', 'Ons', 'Tor', 'Fre'];
let historyWeek = null;
let selectedDate = null;

function weekdayDatesFrom(monday) {
  const dates = [];
  const d = new Date(monday + 'T00:00:00Z');
  for (let i = 0; i < 5; i++) {
    dates.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return dates;
}

function renderHistoryDay() {
  const body = document.getElementById('history-body');
  const snapshots = (historyWeek && historyWeek.days && historyWeek.days[selectedDate]) || [];
  if (snapshots.length === 0) {
    body.innerHTML = '<div class="history-empty">Ingen målinger denne dag.</div>';
    return;
  }
  const rows = snapshots
    .map((s) => {
      const low = s.available <= THRESHOLD ? ' class="low"' : '';
      return `<tr${low}><td class="time">${s.time}</td><td class="count">${s.available} / ${s.max}</td></tr>`;
    })
    .join('');
  body.innerHTML = `<table class="history-table"><tbody>${rows}</tbody></table>`;
}

function selectDay(dateStr) {
  selectedDate = dateStr;
  document.querySelectorAll('.day-btn').forEach((b) => b.classList.toggle('active', b.dataset.date === dateStr));
  renderHistoryDay();
}

async function loadHistory() {
  const toggle = document.getElementById('day-toggle');
  const body = document.getElementById('history-body');
  try {
    const r = await fetch(WORKER_URL + '/history?_=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    historyWeek = d;
    const dates = weekdayDatesFrom(d.weekStart);
    const todayStr = new Date().toLocaleDateString('en-CA'); // en-CA gives YYYY-MM-DD in local time
    selectedDate = dates.includes(todayStr) ? todayStr : dates[0];
    toggle.innerHTML = dates
      .map((dt, i) => {
        const [, m, day] = dt.split('-');
        const active = dt === selectedDate ? ' active' : '';
        return `<button type="button" class="day-btn${active}" data-date="${dt}">${WEEKDAY_LABELS[i]} ${day}/${m}</button>`;
      })
      .join('');
    toggle.querySelectorAll('.day-btn').forEach((btn) => {
      btn.addEventListener('click', () => selectDay(btn.dataset.date));
    });
    renderHistoryDay();
  } catch (e) {
    body.innerHTML = '<div class="history-empty">Kunne ikke hente historik.</div>';
  }
}

const refreshBtn = document.getElementById('refresh');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  await load();
  refreshBtn.disabled = false;
});

load();
loadHistory();
setInterval(load, 60000);
setInterval(loadHistory, 5 * 60000);

let swRegistration = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => { swRegistration = reg; });
}

const pushBtn = document.getElementById('push');

async function checkExistingSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    pushBtn.disabled = true;
    pushBtn.textContent = 'Notifikation ikke understøttet';
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) {
    pushBtn.textContent = 'Notifikation aktiveret';
    pushBtn.disabled = true;
  }
}

pushBtn.addEventListener('click', async () => {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    await fetch(WORKER_URL + '/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });
    pushBtn.textContent = 'Notifikation aktiveret';
    pushBtn.disabled = true;
  } catch (e) {
    pushBtn.textContent = 'Kunne ikke aktivere';
  }
});

checkExistingSubscription();

const showNotifBtn = document.getElementById('shownotif');
showNotifBtn.addEventListener('click', async () => {
  if (!lastState) return;
  if (!('serviceWorker' in navigator) || Notification.permission !== 'granted') {
    alert('Aktiver notifikation først.');
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  await reg.showNotification('P Gasværksgrunden', {
    tag: 'parking-status',
    body: `${lastState.available} ledige (af ${lastState.max}) — opdateret ${new Date(lastState.checked_at).toLocaleTimeString('da-DK')}`,
    icon: 'icon.svg',
    badge: 'icon.svg',
    silent: true,
    requireInteraction: false,
    actions: [{ action: 'refresh', title: 'Opdater nu' }],
    data: { url: './index.html' },
  });
});
</script>
</body>
</html>
